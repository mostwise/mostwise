<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="Terminal window with falling autumn leaves">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .prompt { fill: #3fb950; } .path { fill: #58a6ff; } .cmd { fill: #e6edf3; }
    .key { fill: #d2a8ff; } .val { fill: #c9d1d9; } .warm { fill: #f0883e; } .dim { fill: #8b949e; }

    .line { opacity: 0; animation: show .4s ease forwards; }
    .l1 { animation-delay: .2s; } .l2 { animation-delay: .7s; } .l3 { animation-delay: .9s; }
    .l4 { animation-delay: 1.1s; } .l5 { animation-delay: 1.5s; }
    @keyframes show { to { opacity: 1; } }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .fall-a { animation: sway-a linear infinite; }
    .fall-b { animation: sway-b linear infinite; }
    @keyframes sway-a {
      0%   { transform: translate(0px, -30px) rotate(0deg);   opacity: 0; }
      8%   { opacity: .95; }
      25%  { transform: translate(18px, 40px) rotate(90deg); }
      50%  { transform: translate(-12px, 110px) rotate(200deg); }
      75%  { transform: translate(16px, 180px) rotate(290deg); }
      92%  { opacity: .95; }
      100% { transform: translate(-6px, 250px) rotate(380deg);  opacity: 0; }
    }
    @keyframes sway-b {
      0%   { transform: translate(0px, -30px) rotate(0deg);    opacity: 0; }
      8%   { opacity: .95; }
      25%  { transform: translate(-16px, 40px) rotate(-80deg); }
      50%  { transform: translate(14px, 110px) rotate(-190deg); }
      75%  { transform: translate(-18px, 180px) rotate(-280deg); }
      92%  { opacity: .95; }
      100% { transform: translate(8px, 250px) rotate(-370deg);  opacity: 0; }
    }
  </style>

  <defs>
    <g id="leaf">
      <path d="M0,-10 C7,-7 8,4 0,10 C-8,4 -7,-7 0,-10 Z"/>
      <path d="M0,-9 L0,13" stroke="rgba(0,0,0,.35)" stroke-width="1" fill="none"/>
    </g>
    <clipPath id="body"><rect x="1" y="36" width="718" height="213" rx="10"/></clipPath>
  </defs>

  <!-- window -->
  <rect x="0.5" y="0.5" width="719" height="249" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5,36 V10.5 A10,10 0 0 1 10.5,0.5 H709.5 A10,10 0 0 1 719.5,10.5 V36 Z" fill="#161b22"/>
  <line x1="0.5" y1="36" x2="719.5" y2="36" stroke="#30363d"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>
  <text x="360" y="22.5" text-anchor="middle" class="mono dim" font-size="13">dylan@github: ~</text>

  <!-- text -->
  <g class="mono">
    <text x="24" y="76" class="line l1"><tspan class="prompt">dylan@github</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$ </tspan><tspan class="cmd">cat about.txt</tspan></text>
    <text x="40" y="106" class="line l2"><tspan class="key">name</tspan><tspan x="124" class="val">Dylan</tspan></text>
    <text x="40" y="130" class="line l3"><tspan class="key">focus</tspan><tspan x="124" class="val">self-hosting · security · web</tspan></text>
    <text x="40" y="154" class="line l4"><tspan class="key">season</tspan><tspan x="124" class="warm">autumn</tspan><tspan class="dim" dx="18"># raking bugs, shipping code</tspan></text>
    <text x="24" y="186" class="line l5"><tspan class="prompt">dylan@github</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$ </tspan><tspan class="cmd cursor">█</tspan></text>
  </g>

  <!-- leaves -->
  <g clip-path="url(#body)">
    <!-- pile resting in the corner -->
    <g opacity=".9">
      <use href="#leaf" fill="#c0392b" transform="translate(628 238) rotate(70) scale(1.1)"/>
      <use href="#leaf" fill="#e3652d" transform="translate(648 241) rotate(-60)"/>
      <use href="#leaf" fill="#f2a541" transform="translate(668 236) rotate(100) scale(1.2)"/>
      <use href="#leaf" fill="#d9822b" transform="translate(688 241) rotate(-110)"/>
      <use href="#leaf" fill="#a8461f" transform="translate(656 230) rotate(20) scale(.9)"/>
      <use href="#leaf" fill="#e3652d" transform="translate(702 232) rotate(-30) scale(.85)"/>
    </g>

    <g transform="translate(70 36)"><g class="fall-a" style="animation-duration:9s;animation-delay:-1s"><use href="#leaf" fill="#e3652d"/></g></g>
    <g transform="translate(150 36)"><g class="fall-b" style="animation-duration:12s;animation-delay:-6s"><use href="#leaf" fill="#f2a541" transform="scale(.8)"/></g></g>
    <g transform="translate(230 36)"><g class="fall-a" style="animation-duration:10s;animation-delay:-3s"><use href="#leaf" fill="#c0392b" transform="scale(1.2)"/></g></g>
    <g transform="translate(310 36)"><g class="fall-b" style="animation-duration:8s;animation-delay:-7s"><use href="#leaf" fill="#d9822b"/></g></g>
    <g transform="translate(390 36)"><g class="fall-a" style="animation-duration:13s;animation-delay:-2s"><use href="#leaf" fill="#a8461f" transform="scale(.9)"/></g></g>
    <g transform="translate(460 36)"><g class="fall-b" style="animation-duration:9.5s;animation-delay:-5s"><use href="#leaf" fill="#e3652d" transform="scale(1.1)"/></g></g>
    <g transform="translate(530 36)"><g class="fall-a" style="animation-duration:11s;animation-delay:-8s"><use href="#leaf" fill="#f2a541"/></g></g>
    <g transform="translate(600 36)"><g class="fall-b" style="animation-duration:10.5s;animation-delay:-1.5s"><use href="#leaf" fill="#c0392b" transform="scale(.85)"/></g></g>
    <g transform="translate(670 36)"><g class="fall-a" style="animation-duration:8.5s;animation-delay:-4s"><use href="#leaf" fill="#d9822b" transform="scale(1.15)"/></g></g>
    <g transform="translate(110 36)"><g class="fall-b" style="animation-duration:14s;animation-delay:-10s"><use href="#leaf" fill="#f2a541" transform="scale(.7)"/></g></g>
    <g transform="translate(500 36)"><g class="fall-a" style="animation-duration:15s;animation-delay:-11s"><use href="#leaf" fill="#c0392b" transform="scale(.7)"/></g></g>
    <g transform="translate(350 36)"><g class="fall-b" style="animation-duration:11.5s;animation-delay:-9s"><use href="#leaf" fill="#e3652d" transform="scale(.95)"/></g></g>
  </g>
</svg>
